<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nouvelle cotisation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 1.5rem;
        }

        form {
            max-width: 420px;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            display: inline-block;
            margin-top: 25px;
            padding: 11px 17px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font: inherit;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1e3a8a;
        }

        @media(max-width: 700px) {

            body {
                padding: 15px;
            }

            form {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<h1>Enregistrer une cotisation</h1>

<form th:action="@{/tontines/{id}/cotisations(id=${tontine.id})}" th:object="${cotisationDTO}" method="post">
    <label>Membre :</label>
    <select th:field="*{membreId}">
        <option th:each="m : ${membres}" th:value="${m.id}" th:text="${m.nom}"></option>
    </select><br/>

    <label>Montant :</label>
    <input type="number" th:field="*{montant}" /><br/>

    <label>Date de paiement :</label>
    <input type="date" th:field="*{datePaiement}" /><br/>

    <label>Cycle :</label>
    <input type="number" th:field="*{cycle}" /><br/>

    <label>Statut :</label>
    <select th:field="*{statut}">
        <option th:each="s : ${T(com.MBEMNOVA.Tontine.Entity.Cotisation.StatutCotisation).values()}"
                th:value="${s}" th:text="${s}"></option>
    </select><br/>

    <button type="submit">Enregistrer</button>
</form>
</body>
</html>
