<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connexion - TontinePro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                    linear-gradient(
                            rgba(15, 23, 42, 0.92),
                            rgba(30, 41, 59, 0.92)
                    );
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 40px 30px;

            text-align: center;

            box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2563eb;
            color: white;

            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            margin-bottom: 30px;
        }

        .google-btn {
            display: block;

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            background: white;
            color: #1e293b;

            border: 1px solid #cbd5e1;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .google-btn:hover {
            background: #f8fafc;
            transform: translateY(-2px);
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;

            border-radius: 8px;

            background: #dcfce7;
            color: #166534;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            T
        </div>

        <h1>TontinePro</h1>

        <p class="description">
            Gestion simple et sécurisée de vos tontines
        </p>

        <div
                class="message"
                th:if="${param.logout}">
            Vous avez été déconnecté.
        </div>

        <a
                class="google-btn"
                href="/oauth2/authorization/google">

            🔐 Se connecter avec Google

        </a>

    </div>

</div>

</body>
</html>
