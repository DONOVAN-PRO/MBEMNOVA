<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tontine - TontinePro</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        button,
        .cancel {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: #64748b;
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>

            <span th:if="${tontineDTO.id == null}">
                Nouvelle tontine
            </span>

            <span th:unless="${tontineDTO.id == null}">
                Modifier la tontine
            </span>

        </h1>

        <form
                th:action="${tontineDTO.id == null}
                ? @{/tontines}
                : @{/tontines/{id}/modifier(id=${tontineDTO.id})}"
                th:object="${tontineDTO}"
                method="post">

            <div class="field">

                <label>Nom de la tontine</label>

                <input
                        type="text"
                        th:field="*{nom}"
                        placeholder="Ex : Tontine Famille">

                <div
                        class="error"
                        th:if="${#fields.hasErrors('nom')}"
                        th:errors="*{nom}">
                </div>

            </div>

            <div class="field">

                <label>Montant de cotisation</label>

                <input
                        type="number"
                        step="0.01"
                        th:field="*{montantCotisation}">

                <div
                        class="error"
                        th:if="${#fields.hasErrors('montantCotisation')}"
                        th:errors="*{montantCotisation}">
                </div>

            </div>

            <div class="field">

                <label>Fréquence</label>

                <select th:field="*{frequence}">

                    <option
                            th:each="frequence : ${frequences}"
                            th:value="${frequence}"
                            th:text="${frequence}">
                    </option>

                </select>

            </div>

            <div class="field">

                <label>Date de début</label>

                <input
                        type="date"
                        th:field="*{dateDebut}">

                <div
                        class="error"
                        th:if="${#fields.hasErrors('dateDebut')}"
                        th:errors="*{dateDebut}">
                </div>

            </div>

            <div class="field">

                <label>Statut</label>

                <select th:field="*{statut}">

                    <option
                            th:each="statut : ${statuts}"
                            th:value="${statut}"
                            th:text="${statut}">
                    </option>

                </select>

            </div>

            <button type="submit">
                Enregistrer
            </button>

            <a
                    class="cancel"
                    href="/tontines">
                Annuler
            </a>

        </form>

    </div>

</div>

</body>
</html>
